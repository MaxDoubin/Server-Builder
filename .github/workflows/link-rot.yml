# Weekly check that the archive's citations still resolve.
#
# /verify tells readers that every external link in the writing has been
# checked. That was true on the day it was written and decays from then on:
# 1018 URLs across 236 articles, pointing at documentation that gets
# reorganised, vendor pages that get retired, and personal sites that lapse.
# A promise nobody re-checks becomes a false one quietly.
#
# This is deliberately not part of the build. A pull request must not fail
# because someone else's server had a bad minute, and the checker reaches the
# open internet, which is not something a deploy should depend on. It runs on
# its own schedule and files an issue when something actually breaks.

name: Link rot

on:
  schedule:
    # 07:00 UTC on Mondays. Nothing depends on the exact time; a weekday
    # morning just means a human sees the issue before it is a week stale.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-rot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No install step: the checker uses only node builtins, on purpose, so
      # this job cannot be broken by a dependency change.
      - name: Check every citation
        id: check
        run: |
          set +e
          node script/checkPostLinks.mjs --json > report.json
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          set -e
          node -e '
            const r = require("./report.json");
            const broken = r.broken || [];
            console.log(`checked ${r.total}, broken ${broken.length}, robot walled ${(r.unchecked||[]).length}`);
            require("fs").writeFileSync("broken.md", broken.length === 0 ? "" :
              broken.map(b =>
                `- \`${b.status}\` ${b.url}\n` +
                (b.cites || []).map(c => `  - ${c.file}:${c.line}`).join("\n")
              ).join("\n"));
          '

      - name: File or update an issue
        if: steps.check.outputs.exit != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Link rot: citations in the archive no longer resolve"
          BODY_FILE=issue.md
          {
            echo "The weekly citation check found links that do not resolve."
            echo
            echo "These are cited in published articles, so each one is either a"
            echo "page that moved, a page that is gone, or a host that started"
            echo "refusing automated requests. Fix the link or remove it; do not"
            echo "add the host to BLOCKS_ROBOTS unless you have opened the page"
            echo "yourself and confirmed it is really there."
            echo
            cat broken.md
            echo
            echo "Reproduce locally with \`node script/checkPostLinks.mjs\`."
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > "$BODY_FILE"

          # One issue, reused, so a link that stays broken for a month does not
          # produce four issues.
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi
