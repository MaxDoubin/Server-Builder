name: CI

# Runs on every pull request, and on pushes to main and to the claude/* work
# branches. workflow_dispatch is there so a run can be kicked off by hand
# without pushing an empty commit.
on:
  pull_request:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

# A new push to the same branch makes the in-flight run pointless. Cancel it
# rather than queueing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The site is static and nothing here writes to the repo.
permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # A real gate as of the commit that cleared the backlog to zero.
  #
  # This was "informational" with continue-on-error for a long time, which meant it
  # could never fail a build and 56 errors accumulated behind it. Among them:
  # a camera curve given its arguments one slot out, so the cinematic
  # flythrough followed another curve's leftover coefficients; every useQuery
  # error handler in the game silently dead since the TanStack v5 upgrade; and
  # a rack view whose entire occupied-slot branch was unreachable. All of it
  # was visible to tsc the whole time and nothing was listening.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # node_modules is cached directly, keyed on the lockfile, so an unchanged
      # dependency tree skips the install entirely. The OS and Node major go in
      # the key too: the tree contains compiled output (bufferutil, esbuild)
      # that is not portable between them.
      - name: Restore node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: tsc --noEmit
        run: npx tsc --noEmit

  # ---------------------------------------------------------------------------
  # The real gate. The build must pass, and then every check runs against the
  # output it produced.
  #
  # One job rather than several because four of the five checks read dist/, and
  # passing a 60MB build directory between jobs as an artifact costs more time
  # than the checks take to run.
  # ---------------------------------------------------------------------------
  build:
    name: Build and checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      # Cheap, and it needs no build output, so run it before the slow step.
      - name: Image budget
        run: node scripts-ci/check-image-budget.mjs
      - name: Prefetch map
        run: node scripts-ci/check-prefetch-map.mjs

      # --brand-ash is muted-foreground: every timestamp, tag row and form
      # hint. It shipped at 3.62:1 on the page background, under the 4.5:1 AA
      # floor, and none of that text is large enough for the 3:1 allowance.
      # Source-only, so it runs before the build.
      - name: Colour contrast
        run: node scripts-ci/check-contrast.mjs

      # The notes are the only prose on a tool page. Without them the page is
      # a heading and a box of inputs, which clears the prerender-depth floor
      # while being exactly the empty page that floor exists to catch.
      - name: Tool notes
        run: node scripts-ci/check-tool-notes.mjs

      # An in-view threshold above viewportHeight / elementHeight can never
      # fire, so the content it gates stays at opacity 0 while still taking up
      # its full scroll height. The whole blog index shipped invisible on
      # phones that way. Source-only, so it runs before the build.
      - name: Reveal thresholds
        run: node scripts-ci/check-inview-clamp.mjs

      # CSS drops an invalid declaration silently, so a custom property that
      # was never defined just means the thing it was meant to paint is not
      # painted, with nothing anywhere to say so. --brand-void shipped that
      # way in seven places. Source-only, so it runs before the build.
      - name: Custom properties exist
        run: node scripts-ci/check-css-tokens.mjs

      # The rack builder refuses to stack two devices in one unit, and says so
      # on the page. Its decoder did not: ?b= is readable and editable by
      # design, and a hand-edited link could hang a 3U off the bottom of a 12U
      # frame or put two devices in one unit, both of which then drew. Runs
      # the real decoder over generated links rather than reading the source,
      # because the property is about what it returns rather than what it
      # looks like. Source-only, so it runs before the build.
      - name: Shared rack builds obey the placement rule
        run: npx tsx scripts-ci/check-rack-decode.ts

      # Storage does not fail by returning null. Where a browser blocks site
      # data, touching window.localStorage throws, so an unguarded read in a
      # provider that wraps the whole app does not lose a preference: it
      # throws through React and leaves a blank page, prerendered content
      # included. That is what ThemeProvider did. Five files already wrapped
      # every access and four said why in a comment; eleven accesses in four
      # others did not. Source-only, so it runs before the build.
      - name: Storage access is wrapped
        run: node scripts-ci/check-storage-guards.mjs

      # The cinematic pages have two palettes now, both built by redefining
      # thirteen brand tokens, and that only reaches colours that ask for a
      # token. A literal written into a class is invisible to it and stays as
      # dark as it was while the text on it goes dark: the rack cards on
      # /racks did exactly that, putting 115 of 174 text elements under the
      # floor with a heading at 1.16:1. check-contrast could not see it,
      # because it reads tokens and these were not tokens. SVG fills and the
      # 3D materials are exempt, since a rack chassis is dark in a light room.
      - name: Cinematic surfaces use tokens
        run: node scripts-ci/check-themed-colours.mjs

      # vite build, then the prerenderer over 200+ posts, then the server
      # bundle. The heap bump is for the prerender pass, which holds the whole
      # post index and the rendered HTML for a batch at once.
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # The build reconciles blogPosts.source.ts with content/posts in both
      # directions. If it had to change either, the commit was half a change.
      - name: Post archive in sync
        run: node scripts-ci/check-post-sync.mjs

      # The archive linked outward 554 times and inward zero. A new post that
      # mentions a topic another post is the canonical explainer for should
      # link it, and this fails the build when one does not.
      - name: Internal links in post bodies
        run: npx tsx script/addInternalLinks.ts --check

      # Every route must be prerendered or listed in _redirects, and the
      # catch-all must stay gone so unknown URLs get a real 404.
      - name: Routes reachable
        run: node scripts-ci/check-spa-routes.mjs

      # Nineteen routes, /resume among them, prerendered the site nav and
      # nothing else. React filled them in on the client, which does not help
      # a crawler, a preview card, or an assistant reading the page.
      - name: Prerendered content
        run: node scripts-ci/check-prerender-depth.mjs

      # The sitemap's top-level URLs and the STANDALONE page list are both
      # written by hand in prerender.ts. Two hand-maintained lists describing
      # the same pages already cost this site two guides.
      - name: Sitemap coverage
        run: node scripts-ci/check-sitemap-coverage.mjs

      - name: Bundle budget
        run: node scripts-ci/check-bundle-budget.mjs

      - name: Internal links
        run: node scripts-ci/check-links.mjs

      - name: Page metadata
        run: node scripts-ci/check-meta.mjs

      # Google drops an item missing a required field, silently. An Event
      # with no startDate shipped on all 333 pages before this existed.
      - name: Structured data
        run: node scripts-ci/check-structured-data.mjs

      # A rack page draws the same hardware three ways. Two are generated
      # from the device list; the third is a GLB built by a generator with
      # its own copy of the layout, and that copy has drifted twice.
      - name: Rack models match their device lists
        run: node scripts-ci/check-rack-models.mjs

      - name: Catalogue counts in page prose
        run: node scripts-ci/check-catalogue-counts.mjs

      # The same failure as above with a different number. A count typed into
      # prose has nothing linking it to the thing it counts, so it is right on
      # the day and drifts with every article published: the archive reached
      # 246 posts while the colophon said 236 twice, the roadmap said 236 and
      # the ask page said 236. Source-only, but it sits here beside its twin.
      - name: Archive size in page prose
        run: node scripts-ci/check-stated-counts.mjs

      # A table wider than a phone is either in its own scroller or it is
      # clipped, and clipped means the right-hand columns are unreachable with
      # nothing on screen to say so. Thirteen posts shipped that way. Reads the
      # built HTML and the built CSS, so it cannot be satisfied by a rule the
      # bundler drops.
      - name: Wide content stays reachable
        run: node scripts-ci/check-wide-content.mjs

      # Headings are how a screen reader user moves around a page, so a page
      # with no h1 has no title in that outline and an h1 straight to an h3
      # implies a section that is not there. Three pages shipped with no h1:
      # their React source has one, but the prerenderer writes hand-authored
      # prose for the WebGL pages and those blocks started a level too deep.
      # Reads the built HTML, because the source was already right.
      - name: Heading outlines
        run: node scripts-ci/check-heading-order.mjs

      # Three gates that were written, committed, and never wired to
      # anything. They pass, and between them they were already describing
      # two real bugs nobody was being told about: the prerender $ splice
      # and an http:// citation. A gate that does not run is worse than no
      # gate, because the file in the tree says the check exists.
      #
      # All three read the built HTML only, reach nothing off the machine,
      # and finish in seconds. check-sources.mjs stays out on purpose: it
      # makes 920 serial requests to ninety third parties, and its own
      # header explains why that must never gate a build.
      - name: Canonical URLs
        run: node scripts-ci/check-canonical.mjs

      - name: HTML structure
        run: node scripts-ci/check-html-validity.mjs

      - name: Link safety
        run: node scripts-ci/check-link-safety.mjs

      # A fixed element is viewport chrome, and print has no viewport: the
      # browser drops it on page one of the printout and leaves it there.
      # Printing a post used to come out with the site header across the top,
      # a reading-time pill, a progress bar and the toast container. Source
      # only, because several of them render on a condition a crawler never
      # meets: an open drawer, an open command palette, the preloader.
      - name: Print chrome
        run: node scripts-ci/check-print-chrome.mjs

      # Last because it reads both the source trees and the built HTML.
      - name: Em dashes
        run: node scripts-ci/check-em-dashes.mjs
