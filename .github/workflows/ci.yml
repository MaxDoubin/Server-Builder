name: CI

# Runs on every pull request, and on pushes to main and to the claude/* work
# branches. workflow_dispatch is there so a run can be kicked off by hand
# without pushing an empty commit.
on:
  pull_request:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

# A new push to the same branch makes the in-flight run pointless. Cancel it
# rather than queueing behind it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The site is static and nothing here writes to the repo.
permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------------------
  # A real gate as of the commit that cleared the backlog to zero.
  #
  # This was "informational" with continue-on-error for a long time, which meant it
  # could never fail a build and 56 errors accumulated behind it. Among them:
  # a camera curve given its arguments one slot out, so the cinematic
  # flythrough followed another curve's leftover coefficients; every useQuery
  # error handler in the game silently dead since the TanStack v5 upgrade; and
  # a rack view whose entire occupied-slot branch was unreachable. All of it
  # was visible to tsc the whole time and nothing was listening.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # node_modules is cached directly, keyed on the lockfile, so an unchanged
      # dependency tree skips the install entirely. The OS and Node major go in
      # the key too: the tree contains compiled output (bufferutil, esbuild)
      # that is not portable between them.
      - name: Restore node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      - name: tsc --noEmit
        run: npx tsc --noEmit

  # ---------------------------------------------------------------------------
  # The real gate. The build must pass, and then every check runs against the
  # output it produced.
  #
  # One job rather than several because four of the five checks read dist/, and
  # passing a 60MB build directory between jobs as an artifact costs more time
  # than the checks take to run.
  # ---------------------------------------------------------------------------
  build:
    name: Build and checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund

      # Cheap, and it needs no build output, so run it before the slow step.
      - name: Image budget
        run: node scripts-ci/check-image-budget.mjs
      - name: Prefetch map
        run: node scripts-ci/check-prefetch-map.mjs

      # --brand-ash is muted-foreground: every timestamp, tag row and form
      # hint. It shipped at 3.62:1 on the page background, under the 4.5:1 AA
      # floor, and none of that text is large enough for the 3:1 allowance.
      # Source-only, so it runs before the build.
      - name: Colour contrast
        run: node scripts-ci/check-contrast.mjs

      # The notes are the only prose on a tool page. Without them the page is
      # a heading and a box of inputs, which clears the prerender-depth floor
      # while being exactly the empty page that floor exists to catch.
      - name: Tool notes
        run: node scripts-ci/check-tool-notes.mjs

      # An in-view threshold above viewportHeight / elementHeight can never
      # fire, so the content it gates stays at opacity 0 while still taking up
      # its full scroll height. The whole blog index shipped invisible on
      # phones that way. Source-only, so it runs before the build.
      - name: Reveal thresholds
        run: node scripts-ci/check-inview-clamp.mjs

      # CSS drops an invalid declaration silently, so a custom property that
      # was never defined just means the thing it was meant to paint is not
      # painted, with nothing anywhere to say so. --brand-void shipped that
      # way in seven places. Source-only, so it runs before the build.
      - name: Custom properties exist
        run: node scripts-ci/check-css-tokens.mjs

      # The rack builder refuses to stack two devices in one unit, and says so
      # on the page. Its decoder did not: ?b= is readable and editable by
      # design, and a hand-edited link could hang a 3U off the bottom of a 12U
      # frame or put two devices in one unit, both of which then drew. Runs
      # the real decoder over generated links rather than reading the source,
      # because the property is about what it returns rather than what it
      # looks like. Source-only, so it runs before the build.
      - name: Shared rack builds obey the placement rule
        run: npx tsx scripts-ci/check-rack-decode.ts

      # Storage does not fail by returning null. Where a browser blocks site
      # data, touching window.localStorage throws, so an unguarded read in a
      # provider that wraps the whole app does not lose a preference: it
      # throws through React and leaves a blank page, prerendered content
      # included. That is what ThemeProvider did. Five files already wrapped
      # every access and four said why in a comment; eleven accesses in four
      # others did not. Source-only, so it runs before the build.
      - name: Storage access is wrapped
        run: node scripts-ci/check-storage-guards.mjs

      # The cinematic pages have two palettes now, both built by redefining
      # thirteen brand tokens, and that only reaches colours that ask for a
      # token. A literal written into a class is invisible to it and stays as
      # dark as it was while the text on it goes dark: the rack cards on
      # /racks did exactly that, putting 115 of 174 text elements under the
      # floor with a heading at 1.16:1. check-contrast could not see it,
      # because it reads tokens and these were not tokens. SVG fills and the
      # 3D materials are exempt, since a rack chassis is dark in a light room.
      - name: Cinematic surfaces use tokens
        run: node scripts-ci/check-themed-colours.mjs

      # vite build, then the prerenderer over 200+ posts, then the server
      # bundle. The heap bump is for the prerender pass, which holds the whole
      # post index and the rendered HTML for a batch at once.
      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # The build reconciles blogPosts.source.ts with content/posts in both
      # directions. If it had to change either, the commit was half a change.
      - name: Post archive in sync
        run: node scripts-ci/check-post-sync.mjs

      # The archive linked outward 554 times and inward zero. A new post that
      # mentions a topic another post is the canonical explainer for should
      # link it, and this fails the build when one does not.
      - name: Internal links in post bodies
        run: npx tsx script/addInternalLinks.ts --check

      # Every route must be prerendered or listed in _redirects, and the
      # catch-all must stay gone so unknown URLs get a real 404.
      - name: Routes reachable
        run: node scripts-ci/check-spa-routes.mjs

      # Nineteen routes, /resume among them, prerendered the site nav and
      # nothing else. React filled them in on the client, which does not help
      # a crawler, a preview card, or an assistant reading the page.
      - name: Prerendered content
        run: node scripts-ci/check-prerender-depth.mjs

      # The sitemap's top-level URLs and the STANDALONE page list are both
      # written by hand in prerender.ts. Two hand-maintained lists describing
      # the same pages already cost this site two guides.
      - name: Sitemap coverage
        run: node scripts-ci/check-sitemap-coverage.mjs

      - name: Bundle budget
        run: node scripts-ci/check-bundle-budget.mjs

      - name: Internal links
        run: node scripts-ci/check-links.mjs

      - name: Page metadata
        run: node scripts-ci/check-meta.mjs

      # Google drops an item missing a required field, silently. An Event
      # with no startDate shipped on all 333 pages before this existed.
      - name: Structured data
        run: node scripts-ci/check-structured-data.mjs

      # A rack page draws the same hardware three ways. Two are generated
      # from the device list; the third is a GLB built by a generator with
      # its own copy of the layout, and that copy has drifted twice.
      - name: Rack models match their device lists
        run: node scripts-ci/check-rack-models.mjs

      - name: Catalogue counts in page prose
        run: node scripts-ci/check-catalogue-counts.mjs

      # The same failure as above with a different number. A count typed into
      # prose has nothing linking it to the thing it counts, so it is right on
      # the day and drifts with every article published: the archive reached
      # 246 posts while the colophon said 236 twice, the roadmap said 236 and
      # the ask page said 236. Source-only, but it sits here beside its twin.
      - name: Archive size in page prose
        run: node scripts-ci/check-stated-counts.mjs

      # A table wider than a phone is either in its own scroller or it is
      # clipped, and clipped means the right-hand columns are unreachable with
      # nothing on screen to say so. Thirteen posts shipped that way. Reads the
      # built HTML and the built CSS, so it cannot be satisfied by a rule the
      # bundler drops.
      - name: Wide content stays reachable
        run: node scripts-ci/check-wide-content.mjs

      # Headings are how a screen reader user moves around a page, so a page
      # with no h1 has no title in that outline and an h1 straight to an h3
      # implies a section that is not there. Three pages shipped with no h1:
      # their React source has one, but the prerenderer writes hand-authored
      # prose for the WebGL pages and those blocks started a level too deep.
      # Reads the built HTML, because the source was already right.
      - name: Heading outlines
        run: node scripts-ci/check-heading-order.mjs

      # Three gates that were written, committed, and never wired to
      # anything. They pass, and between them they were already describing
      # two real bugs nobody was being told about: the prerender $ splice
      # and an http:// citation. A gate that does not run is worse than no
      # gate, because the file in the tree says the check exists.
      #
      # All three read the built HTML only, reach nothing off the machine,
      # and finish in seconds. check-sources.mjs stays out on purpose: it
      # makes 920 serial requests to ninety third parties, and its own
      # header explains why that must never gate a build.
      - name: Canonical URLs
        run: node scripts-ci/check-canonical.mjs

      - name: HTML structure
        run: node scripts-ci/check-html-validity.mjs

      - name: Link safety
        run: node scripts-ci/check-link-safety.mjs

      # script-src names one sha256 rather than carrying 'unsafe-inline', so
      # the boot veil is the only inline script that may run. Edit a character
      # of it and the hash stops matching: the veil silently stops working and
      # nothing else would notice. This recomputes it from the build.
      - name: CSP script hash
        run: node scripts-ci/check-csp-hash.mjs

      # A fixed element is viewport chrome, and print has no viewport: the
      # browser drops it on page one of the printout and leaves it there.
      # Printing a post used to come out with the site header across the top,
      # a reading-time pill, a progress bar and the toast container. Source
      # only, because several of them render on a condition a crawler never
      # meets: an open drawer, an open command palette, the preloader.
      - name: Print chrome
        run: node scripts-ci/check-print-chrome.mjs

      # A capture exercise rots in two ways that are invisible in review: a
      # hint filter stops matching anything, so the hint sends the reader to
      # an empty list, or the accepted answer drifts from what is in the
      # packets, so a correct reading is marked wrong. Both are checked here,
      # along with the filter engine itself against a table of expressions
      # with results worked out by hand.
      - name: Packet captures
        run: npx tsx scripts-ci/check-captures.ts

      # Every lab ships a transcript that solves it, replayed here through the
      # real shell against a real build of the machine. It proves the lab is
      # solvable, that the predicate matches the intended route, and that
      # every command the solution uses still works. It also checks the
      # negative: an empty session must not report solved. Both halves have
      # found real bugs, including two labs whose solutions were entirely
      # Permission denied while the lab still reported itself solved.
      - name: Lab solutions
        run: npx tsx scripts-ci/check-labs.ts

      # A branching scenario is a graph written by hand in a prose file, which
      # is exactly the kind of thing that grows a choice pointing at a scene
      # that was renamed, an ending nothing routes to, or a loop a reader can
      # wander forever. None of those are type errors and none are visible in
      # review. Ending rarity is a share of all start-to-ending paths, so a
      # cycle would make it infinite and an orphan ending would make it a lie.
      - name: Scenario graphs
        run: npx tsx scripts-ci/check-scenarios.ts

      # A challenge is only worth doing if the flag it accepts is the flag the
      # artefact yields. The flags themselves live in this script and nowhere
      # in the bundle, so the check hashes each one, compares it to what the
      # page will compare against, and rejects a near miss. It also greps the
      # brief, the hints and the tagline for the flag, because a challenge
      # whose answer is printed above the answer box is not a challenge.
      - name: Challenge flags
        run: npx tsx scripts-ci/check-challenges.ts

      # The triage inbox is hand-written prose about hand-written headers, and
      # the two drift silently: move a hyphen and the only finding in a message
      # disappears while the analysis still calls it hostile. This derives every
      # message's signals from its own headers with the same detectors the page
      # uses and refuses a mismatch in either direction, including a message
      # meant to be clean that picked up a real tell by accident.
      - name: Triage inbox
        run: npx tsx scripts-ci/check-triage.ts

      # Each firewall exercise ships a chain that satisfies it, replayed here
      # through the real evaluator. The other half matters as much: the
      # STARTING chain has to fail, or an exercise that is accidentally already
      # correct passes CI forever while marking every reader instantly done.
      # A table of packets with verdicts worked out by hand checks the engine
      # itself, because otherwise a broken first-match-wins would still let
      # every solution "solve" its exercise against the same broken engine.
      - name: Firewall exercises
        run: npx tsx scripts-ci/check-firewall.ts

      # Every DNS case names an outcome, and the exercise is learning to tell
      # those outcomes apart, so a case that says "lame delegation" while the
      # resolver reaches no-glue teaches the wrong lesson while looking
      # entirely correct. This runs each one and compares. It also refuses any
      # name outside a reserved suffix or address outside a documentation
      # range, so nothing copied out of the page reaches anything real.
      - name: DNS resolution cases
        run: npx tsx scripts-ci/check-resolve.ts

      # Each chain case names both a fault and the party who has to fix it,
      # and the owner is the half that would rot silently: an explanation
      # saying only the client can fix this, against a validator naming the
      # server, teaches someone to open a ticket with the wrong team while
      # looking entirely correct. Both are compared against the validator, plus
      # the RFC 6125 wildcard rules, which are the piece people implement from
      # memory and get wrong in the same two ways every time.
      - name: Certificate chains
        run: npx tsx scripts-ci/check-chain.ts

      # An address plan can be arithmetically infeasible, and it is easy to
      # write one by accident: I did, and the first run of this caught it while
      # I was still calling it an exercise. Every solution is replayed, every
      # empty plan must fail, host counts are summed against the block and
      # against each summary constraint, and a table of alignment, overlap and
      # usable-count results worked out by hand checks the arithmetic itself.
      - name: Address plans
        run: npx tsx scripts-ci/check-allocate.ts

      # The array calculator is entirely arithmetic, so the check is a table of
      # capacities, tolerances, rebuild times and probabilities worked out by
      # hand. It earned its keep immediately: the textbook form of the URE
      # expression silently returns zero for small rates, because subtracting
      # 1e-17 from 1 in a float64 gives exactly 1, and the wrong answer reads
      # as a very reassuring number rather than as an error.
      - name: Array arithmetic
        run: npx tsx scripts-ci/check-array.ts

      # A surface whose list gets renamed or emptied simply stops appearing in
      # the daily selection, and the page still renders a tidy grid with one
      # fewer card: nobody notices the labs have not been offered for a month.
      # This asserts every surface appears every day, that the pick is
      # deterministic including for negative day numbers, and that it is a true
      # rotation rather than a hash, so each list shows everything before it
      # repeats anything.
      - name: Daily selection
        run: npx tsx scripts-ci/check-today.ts

      # A break whose stop point drifts past the end of its sequence still
      # renders: the page draws a diagram, greys out nothing, and describes a
      # symptom belonging to a step that does not exist. This checks every
      # break lands on a real step, that the breaks in one handshake do not all
      # stop in the same place, and that directions alternate unless a step
      # declares itself part of a flight.
      - name: Handshake sequences
        run: npx tsx scripts-ci/check-handshake.ts

      # A scenario whose copies all survive its own incident demonstrates
      # nothing while reading as if it demonstrates something, so the
      # survival outcome is compared against what each scenario claims about
      # itself. It also pins the megabytes-per-second to gigabytes-per-hour
      # conversion, which is out by 2.4 per cent forever if you divide by
      # 1000, in the direction that flatters the estimate.
      - name: Backup and restore model
        run: npx tsx scripts-ci/check-restore.ts

      # Bitwise operators in JavaScript return signed 32 bit values, so a
      # /24 mask comes back as -256 without an unsigned shift and every
      # comparison after that is wrong while still looking right for small
      # prefixes. This pins the arithmetic against masks and block boundaries
      # worked out by hand, replays every lookup, and requires a majority of
      # the probes to be ones where longest prefix and first match disagree:
      # a set that reading top to bottom answers correctly teaches nothing.
      - name: Routing table lookups
        run: npx tsx scripts-ci/check-route.ts

      # The path MTU model computes each path's MTU twice, once as the
      # minimum of its links and once by walking a packet of every size
      # through the simulation the page actually draws, and the two must
      # agree. It also enforces the lesson: a path claiming to blackhole must
      # be one a default ping crosses, and the hop blamed for swallowing the
      # ICMP must be the last blocker at or before the drop point. The weaker
      # form of that last rule let a bug through in review.
      - name: Path MTU model
        run: npx tsx scripts-ci/check-mtu.ts

      # A synthetic log drifts into shapes no daemon emits, which teaches
      # somebody to recognise something they will never see. Every line is
      # rendered to syslog format and parsed back by a deliberately strict
      # parser. It also enforces the point of the whole surface: the deciding
      # line is never part of the log's loudest pattern, every distractor is
      # supported by real lines, and the answers are spread across the option
      # positions so a reader who always picks the second one fails.
      - name: The logs look like logs
        run: npx tsx scripts-ci/check-logs.ts

      # The palette is the one box that reaches everything, which only holds
      # while it knows about every page. Sixteen surfaces had been built,
      # shipped and linked from the footer without ever being added to it:
      # typing "firewall" returned articles that mention firewalls and not
      # the firewall exercise. Every route must now be named in the palette,
      # generated from a registry it loads, or excepted with a reason.
      - name: The palette reaches every page
        run: npx tsx scripts-ci/check-palette.ts

      # An explanation with a number in it goes stale the moment a parameter is
      # edited, and a case that says "about 14 Mbps" beside a model computing
      # 17 is worse than one with no number: the reader believes the sentence.
      # This replays every case's declared answer against the model, checks the
      # model against arithmetic done by hand, and matches every throughput
      # quoted in the prose to a figure the model actually produces.
      - name: Throughput model
        run: npx tsx scripts-ci/check-transfer.ts

      # A glossary is the surface that rots quietest: nothing breaks when the
      # writing starts using a term nobody defined, and nothing breaks when a
      # definition outlives the last article that used the word. This checks
      # both directions. Every entry must appear somewhere in the site's prose,
      # and any acronym the articles use more than 25 times with no entry fails
      # the build, so the glossary cannot fall behind what is being written.
      - name: Glossary coverage
        run: npx tsx scripts-ci/check-glossary.ts

      # A failure with no symptom: for weeks the home page linked to two
      # places while ten interactive surfaces sat reachable only from the nav.
      # The gate written for that kept a hand-typed list of twelve routes, so
      # six surfaces added in one day were never checked and the array
      # calculator, which had never been in the list, sat reachable only from
      # the footer while the gate reported OK. The list is derived from the
      # practise registry now, and this checks both directions: every surface
      # is linked from the act, the hub, the palette and the footer, and
      # every practise-looking link in those places is a registered surface.
      - name: Every practise surface is findable
        run: npx tsx scripts-ci/check-practise-surfaces.ts

      # Nine mode bits, and the two thirds of them the kernel never consults.
      # The cases carry no answer key: each declares its four decision points
      # and the model works out the verdict, so prose that disagrees with its
      # own tree fails here. The model is then checked against the rules
      # rather than against the cases, over generated paths whose corpus is
      # measured first, because the version of this that shipped was passing
      # against four thousand inputs that never reached a target node.
      - name: File permissions resolve correctly
        run: npx tsx scripts-ci/check-permissions.ts

      # The deployer decision tree, transcribed rather than reimplemented, so
      # a single flipped cell would teach a wrong judgement with a citation
      # attached. Checked by a property instead of by fetching the source on
      # every build: worsening any one decision point must never lower the
      # priority, which holds across all 186 single-step comparisons.
      - name: Patch priority matches the published tree
        run: npx tsx scripts-ci/check-patch.ts

      # Retries multiply and nobody writes the product. Exactly one option
      # per case has to match what the model computes, which catches both a
      # case whose arithmetic has drifted from its prose and two options that
      # are accidentally the same answer written twice.
      - name: Retry amplification adds up
        run: npx tsx scripts-ci/check-retry.ts

      # 802.1Q, where the native VLAN crosses a trunk with nothing on it and
      # two ends that disagree join two broadcast domains in silence. The
      # model is held to the tagging rules over generated paths, including
      # the one the surface exists for: changing the receiving end's native
      # VLAN has to move an untagged frame.

      - name: VLAN tagging follows 802.1Q
        run: npx tsx scripts-ci/check-vlan.ts

      # A wrong clock reports itself under four names and three never mention
      # time, so the exercise runs backwards: given what broke and what did
      # not, how wrong is the clock. The cases carry no answer key. The gate
      # intersects the rules to a range, requires exactly one option to claim
      # it, and then checks that interval algebra against counting every
      # second across the whole fortnight, over generated observation sets.
      - name: Clock skew narrows to one range
        run: npx tsx scripts-ci/check-clock.ts

      # ENOSPC covers five distinct faults and EDQUOT is the sixth, so the
      # cases carry a filesystem rather than a cause and the model works out
      # which one refused the write. Then the model is held to the rules over
      # generated filesystems, whose corpus is measured first: the version of
      # this that would have shipped had a generator giving every quota to
      # the user doing the writing, so reading the wrong quota row passed.
      - name: Disk-full causes are derived, not declared
        run: npx tsx scripts-ci/check-space.ts

      # A shared cache keys on the URL and exactly what Vary names, so the
      # cases carry requests and headers rather than a verdict and the model
      # works out which request is served somebody else's page. Then the
      # replay is checked against a stateless recomputation, which is what
      # caught the first version treating a request that hit as one that had
      # fetched a response. And every stated fix is applied to its own case
      # and replayed, because a remedy that would not have worked is the one
      # thing here that nothing else would notice.
      - name: Cache keys decide who sees what
        run: npx tsx scripts-ci/check-cache.ts

      # The OOM surface is arithmetic all the way down, so the gate recomputes
      # every case a second time and requires exactly one option to name what
      # dies. The second half is the one that earned its place: every figure
      # in the prose has to be a quantity the case produces. Writing them by
      # hand I got five wrong in one sitting, all the same way, dividing MiB
      # by a thousand instead of 1024. It also caught eight of ten answers
      # sitting in the same option position, which no amount of proofreading
      # the numbers would have found.
      - name: The OOM killer picks by arithmetic
        run: npx tsx scripts-ci/check-oom.ts

      # And the gate one level below check-ci-coverage. That one finds a gate
      # the workflow never runs; this one finds a model function no gate ever
      # names. Three of those turned up in one day, each found by breaking the
      # code and noticing nothing broke, which is a good habit and a bad
      # system: it only finds what you think to break. On its first run this
      # found nine more, across four surfaces.
      - name: Every model function is exercised by its gate
        run: node scripts-ci/check-model-coverage.mjs

      # And the one beside it. That gate asks whether anything exercises a
      # model function; this one asks whether the page uses the answer the
      # model computed, or has its own. Two surfaces had their own: a
      # hand-typed index into the options array, bounds-checked and otherwise
      # believed. Repointing /resolve's at "The mail server is refusing
      # connections" passed every gate, on the one exercise whose subject is
      # that the symptom does not tell you which fault you have. The
      # denominator is the point: an earlier version counted five of five by
      # looking for names it already knew, and neither broken surface was in
      # the five.
      - name: Answers are computed, not declared
        run: node scripts-ci/check-answer-keys.mjs

      # And the gate that would have caught the four above being absent. Four
      # gates were written in one day, each blinded a dozen ways to prove it
      # caught what it was for, and none was added to this file: forty-six
      # deliberate breakages, all correctly detected, by scripts that ran on
      # one laptop and on no commit. Nothing noticed because nothing here
      # read the workflow. This compares the workflow against the directory
      # in both directions.
      - name: Every gate actually runs
        run: node scripts-ci/check-ci-coverage.mjs

      # A service worker outlives the deploy that installed it, so getting the
      # document strategy wrong does not show up as a bad-looking page, it
      # shows up as returning visitors stuck on a build whose chunk files the
      # CDN no longer has. This runs sw.js against a fake network and asserts
      # what a reader gets on a fast connection, a slow one, and no connection
      # at all. Source only; no browser and no build needed.
      - name: Service worker documents
        run: node scripts-ci/check-sw-documents.mjs

      # A module no import reaches is a module the bundler never sees, so
      # nothing else here can notice it: every other gate scans it, typecheck
      # compiles it, npm installs its dependencies, and none of that reaches a
      # browser. Sixty-five such files were found at once, holding twenty-seven
      # packages in place.
      - name: Dead modules
        run: node scripts-ci/check-dead-modules.mjs

      # Last because it reads both the source trees and the built HTML.
      - name: Em dashes
        run: node scripts-ci/check-em-dashes.mjs
