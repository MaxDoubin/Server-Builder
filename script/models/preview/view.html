<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;background:#f2f3f5;overflow:hidden}
  body.alpha,html.alpha{background:transparent}
</style></head><body>
<script type="importmap">
{"imports":{"three":"/node_modules/three/build/three.module.js",
            "three/addons/":"/node_modules/three/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const file = q.get('f');
const view = q.get('view') || 'face';       // face | angle | detail
const zoom = parseFloat(q.get('zoom') || '1');
const panX = parseFloat(q.get('x') || '0'); // -1..1 across the face
/*
  Transparent ground, for catalogue thumbnails.

  The studio ground is a near white, which is right for judging a model
  against the pages it ships on and wrong for a product shot, because most
  of Ubiquiti's hardware is itself white: thirty eight of their models came
  out as a white object on a white field and trimmed to an empty card. Any
  fixed colour just moves the problem to whichever products match it, so
  with alpha=1 the background is dropped entirely and the card underneath
  shows through, which works on a light card and a dark one alike.
*/
const alpha = q.get('alpha') === '1';

const W = 1600, H = 900;
/*
  preserveDrawingBuffer, when the background is being cut out.

  With it off the browser is free to throw the frame away the moment it has
  composited it, and a screenshot of a transparent canvas then comes back
  empty rather than coming back wrong, which is the sort of failure that
  costs an hour. It also makes the canvas readable from script, which is the
  only way to check a render without trusting the screenshot.
*/
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha,
  preserveDrawingBuffer: alpha,
});
renderer.setSize(W, H);
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
if (alpha) {
  renderer.setClearColor(0x000000, 0);
  document.documentElement.classList.add('alpha');
  document.body.classList.add('alpha');
} else {
  scene.background = new THREE.Color('#f2f3f5');
}
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// The same studio the rack pages use, so what I see here is what ships.
for (const [hex, power, at] of [
  ['#ffffff', 2.4, [1.8, 2.4, 2.4]],
  ['#e8eeff', 0.75, [-2.2, 1.4, 1.6]],
  ['#ffffff', 1.3, [-0.6, 2.0, -2.4]],
]) {
  const l = new THREE.DirectionalLight(hex, power);
  l.position.set(...at);
  scene.add(l);
}
scene.add(new THREE.AmbientLight('#ffffff', 0.3));

const camera = new THREE.PerspectiveCamera(28, W / H, 0.001, 40);

// Vendor models are Draco compressed and ours are meshopt, and a
// model reprocessed here can be either. Wiring both decoders in
// unconditionally costs nothing and loads all of them.
const draco = new DRACOLoader().setDecoderPath('/draco/');
// Vendor textures come as KTX2 Basis, which needs a transcoder that in
// turn needs the renderer to say which compressed formats the GPU takes.
const ktx2 = new KTX2Loader().setTranscoderPath('/basis/').detectSupport(renderer);
new GLTFLoader().setDRACOLoader(draco).setKTX2Loader(ktx2)
  .setMeshoptDecoder(MeshoptDecoder).load(file, (gltf) => {
  const root = gltf.scene;
  /*
    Two conventions, and it takes measuring the world bounds through the
    node tree to tell them apart rather than reading the accessors, which
    is what made this confusing. Our generators emit Z-up geometry with no
    root transform, so the whole scene has to be laid back a quarter turn
    about X. Ubiquiti's exports look Z-up in their accessors but carry that
    same quarter turn on the root node already, so they arrive correctly
    Y-up and in metres, and laying them back again puts the camera on the
    lid.

    What they do not agree on is which horizontal axis the panel runs
    along. Ours is X. Theirs is Z, so a Ubiquiti model loaded square on
    frames the side of the box, 288mm by 44mm of blank sheet metal, which
    reads as a rendering failure and is not one. A quarter turn about
    whichever axis is up fixes it.
  */
  const yaw = (parseFloat(q.get('yaw') || '0') * Math.PI) / 180;
  const up = q.get('up') || 'z';
  root.rotation[up === 'z' ? 'z' : 'y'] = yaw;
  const stage = new THREE.Group();
  if (up === 'z') stage.rotation.x = -Math.PI / 2;
  stage.add(root);
  stage.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(stage);
  const size = box.getSize(new THREE.Vector3());
  stage.position.sub(box.getCenter(new THREE.Vector3()));
  scene.add(stage);

  const fov = (camera.fov * Math.PI) / 180;
  // Frame the wider of the two face axes, then apply the requested zoom.
  const span = Math.max(size.y, (size.x * H) / W);
  const dist = (span / 2 / Math.tan(fov / 2)) * 1.12 / zoom;

  if (view === 'angle') {
    /*
      Face-on only has to clear the face, so width and height are enough.
      From an angle the depth is in shot too, and a rack server is far
      deeper than it is wide: framing a 1U PowerEdge on its 443mm face puts
      the camera 556mm out, which is inside a chassis 750mm deep. The result
      looks like a broken model and is a camera standing in the middle of a
      working one. So swing out far enough to clear the footprint diagonal.
    */
    const reach = Math.hypot(size.x, size.z);
    const a = (34 * Math.PI) / 180;
    const d = Math.max(dist, (reach / 2 / Math.tan(fov / 2)) * 1.15 / zoom);
    camera.position.set(Math.sin(a) * d, Math.max(size.y * 0.25, reach * 0.22), Math.cos(a) * d);
  } else {
    camera.position.set((panX * size.x) / 2, 0, dist);
  }
  camera.lookAt((panX * size.x) / 2, 0, 0);
  camera.updateProjectionMatrix();

  renderer.render(scene, camera);
  document.title = 'ready';
});
</script></body></html>
