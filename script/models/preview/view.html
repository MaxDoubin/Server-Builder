</style></head><body>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const file = q.get('f');
const view = q.get('view') || 'face';       // face | angle | detail
const zoom = parseFloat(q.get('zoom') || '1');
const panX = parseFloat(q.get('x') || '0'); // -1..1 across the face

const W = 1600, H = 900;
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(W, H);
renderer.setPixelRatio(1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#f2f3f5');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// The same studio the rack pages use, so what I see here is what ships.
for (const [hex, power, at] of [
  ['#ffffff', 2.4, [1.8, 2.4, 2.4]],
  ['#e8eeff', 0.75, [-2.2, 1.4, 1.6]],
  ['#ffffff', 1.3, [-0.6, 2.0, -2.4]],
]) {
  const l = new THREE.DirectionalLight(hex, power);
  l.position.set(...at);
  scene.add(l);
}
scene.add(new THREE.AmbientLight('#ffffff', 0.3));

const camera = new THREE.PerspectiveCamera(28, W / H, 0.001, 40);

new GLTFLoader().load(file, (gltf) => {
  const root = gltf.scene;
  // Generators work Z-up; glTF is Y-up.
  root.rotation.set(-Math.PI / 2, 0, 0);
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  root.position.sub(box.getCenter(new THREE.Vector3()));
  scene.add(root);

  const fov = (camera.fov * Math.PI) / 180;
  // Frame the wider of the two face axes, then apply the requested zoom.
  const span = Math.max(size.y, (size.x * H) / W);
  const dist = (span / 2 / Math.tan(fov / 2)) * 1.12 / zoom;

  if (view === 'angle') {
    const a = (34 * Math.PI) / 180;
    camera.position.set(Math.sin(a) * dist, size.y * 0.25, Math.cos(a) * dist);
  } else {
    camera.position.set((panX * size.x) / 2, 0, dist);
  }
  camera.lookAt((panX * size.x) / 2, 0, 0);
  camera.updateProjectionMatrix();

  renderer.render(scene, camera);
  document.title = 'ready';
});
</script></body></html>
